<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GREENSHOP</title>
    <link rel="stylesheet" href="./style/reset200802.css">
    <link rel="stylesheet" href="./style/normalize.css">
    <link rel="stylesheet" href="./style/style.css">
</head>
<body>
    <div class="container"> 
        <div>
            <p class="head-line"><a href="#">Login</a> | <span class="current">Register</span></p>
        </div>
        <form>
            <p class="text">Enter your email and password to register.</p>
            <input type="text" placeholder="Username" required>
            <input type="email" placeholder="Enter your email address" required>
            <input type="password" placeholder="Password" required>
            <input type="password" placeholder="Confirm Password" required>
            <button type="submit" class="btn_submit">Register</button>
        </form>
          <p class="text">Or register with</p>
          <button class="btn_social">
            <img src="./images/google_1.png" alt="Google">
            <span>Continue with Google</span>
          </button>
          <button class="btn_social">
            <img src="./images/facebook_1.png" alt="Facebook">
            <span>Continue with Facebook</span>
          </button>
    </div>
</body>
</html>
