<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GREENSHOP</title>
    <link rel="stylesheet" href="./style/style.css">
</head>
<body>
    <div class="container"> 
        <div>
            <p class="head-line"><span class="current">Login</span> | <a href="#">Register</a></p>
        </div>
        <form>
            <p>Enter your username and password to login.</p>
            <input type="text" placeholder="Username" required>
            <input type="password" placeholder="Password" required>
            <button type="submit" class="btn_submit">Login</button>
        </form>
          <p>Or login with</p>
          <button class="btn_social">
            <img src="./images/google_1.png" alt="Google">
            <span>Continue with Google</span>
          </button>
          <button class="btn_social">
            <img src="./images/facebook_1.png" alt="Facebook">
            <span>Continue with Facebook</span>
          </button>
    </div>    
</body>
</html>
